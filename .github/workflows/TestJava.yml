# Runs all the unit tests (Login and Message) every time code is pushed to GitHub.
name: TestJava

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Run the tests
        run: mvn --batch-mode test
